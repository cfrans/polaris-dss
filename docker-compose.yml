# Polaris DSS — ambiente local
#
# Por padrão sobe APENAS o banco de auditoria do Polaris:
#     docker compose up -d
#
# O stack do Zabbix é OPCIONAL e vive no profile "zabbix". A maioria dos ambientes que adotariam
# este sistema já possui um Zabbix em operação — nesse caso, não suba o daqui: aponte o Polaris para
# o Zabbix existente via ZABBIX_URL no .env. Para subir um Zabbix local de laboratório:
#     docker compose --profile zabbix up -d
#
# ATENÇÃO: o ALVO da remediação não é um container. Os três cenários exigem systemd (reinício de
# serviço), controle de processos por PID e uma partição que possa encher — nada disso funciona
# corretamente em container padrão, e saturar o disco de um container satura o disco do hospedeiro.
# Use uma VM Linux real como host monitorado, com uma partição dedicada para o cenário de disco.

name: polaris

services:
  # ---------------------------------------------------------------------------
  # Banco de auditoria do Polaris — sempre sobe. Independente do banco do Zabbix.
  # ---------------------------------------------------------------------------
  polaris-db:
    image: postgres:16
    container_name: polaris-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME_AUDIT:-polaris_audit}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - polaris-db-data:/var/lib/postgresql/data
      # O esquema NÃO é montado em docker-entrypoint-initdb.d de propósito: aquele diretório só
      # roda na primeira criação do volume, o que deixaria bancos existentes para trás em silêncio.
      # Depois de subir o container, aplique o esquema com: python -m src.db.migrate
    ports:
      # Porta configurável para não colidir com um PostgreSQL já instalado na máquina.
      - "${POLARIS_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME_AUDIT:-polaris_audit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API REST e Interface HITL do Polaris — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  polaris-api:
    build: .
    container_name: polaris-api
    environment:
      # Banco de auditoria: sempre o serviço interno, na rede do Compose.
      DB_HOST: polaris-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME_AUDIT: ${DB_NAME_AUDIT:-polaris_audit}

      # Telemetria. Sem padrão de endereço: cada ambiente aponta para o seu Zabbix no .env, e o
      # caminho /api_jsonrpc.php é parte da URL do endpoint JSON-RPC.
      ZABBIX_URL: ${ZABBIX_URL:-}
      ZABBIX_USER: ${ZABBIX_USER:-}
      ZABBIX_PASSWORD: ${ZABBIX_PASSWORD:-}

      # Recepção de eventos. Sem token, o webhook responde 401 a tudo.
      POLARIS_WEBHOOK_TOKEN: ${POLARIS_WEBHOOK_TOKEN:-}

      # Endpoints de simulação. Mantenha false durante a coleta de dados.
      POLARIS_DEBUG: ${POLARIS_DEBUG:-false}

      # Fatores de confiança dependentes do histórico de auditoria (F3 e F4).
      # ATENÇÃO: desligue durante a coleta oficial, para que todas as rodadas de um mesmo cenário
      # enfrentem condições idênticas de decisão. Sem esta variável repassada ao container, o
      # ajuste feito no .env não teria efeito algum e a amostra ficaria comprometida em silêncio.
      POLARIS_CONFIDENCE_HISTORY: ${POLARIS_CONFIDENCE_HISTORY:-true}

      # Host alvo da remediação.
      TARGET_SSH_HOST: ${TARGET_SSH_HOST:-}
      TARGET_SSH_USER: ${TARGET_SSH_USER:-polaris}
      TARGET_SSH_KEY_PATH: /run/secrets/polaris_ssh_key

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${POLARIS_API_PORT:-8000}:8000"
    volumes:
      # Apenas a chave dedicada à remediação, somente leitura. Montar `~/.ssh` inteiro daria ao
      # container todas as chaves privadas do operador — o oposto do menor privilégio que o sistema
      # exige do host alvo.
      - ${TARGET_SSH_KEY_PATH:-./secrets/polaris_ed25519}:/run/secrets/polaris_ssh_key:ro
    depends_on:
      polaris-db:
        condition: service_healthy
    networks:
      - polaris-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zabbix de laboratório — profile "zabbix" (não sobe por padrão)
  # ---------------------------------------------------------------------------
  zabbix-db:
    image: postgres:16
    container_name: zabbix-db
    profiles: ["zabbix"]
    environment:
      POSTGRES_USER: ${ZBX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZBX_DB_USER:-zabbix} -d zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polaris-network
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    profiles: ["zabbix"]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZBX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    depends_on:
      zabbix-db:
        condition: service_healthy
    networks:
      - polaris-network
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    profiles: ["zabbix"]
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: ${ZBX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZBX_DB_PASSWORD:-zabbix}
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "${ZBX_WEB_PORT:-8080}:8080"
    depends_on:
      - zabbix-server
    networks:
      - polaris-network
    restart: unless-stopped

  # Agent que monitora o próprio ambiente de containers. Útil para validar a instalação do Zabbix,
  # mas NÃO é o alvo do experimento — o alvo é a VM Linux, com seu próprio zabbix-agent2.
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    profiles: ["zabbix"]
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: polaris-docker-host
    ports:
      - "10050:10050"
    depends_on:
      - zabbix-server
    networks:
      - polaris-network
    restart: unless-stopped

networks:
  polaris-network:
    driver: bridge

volumes:
  polaris-db-data:
  zabbix-db-data:
