version: '3.8'

services:
  # PostgreSQL database for both Zabbix and Polaris Audit
  postgres-server:
    image: postgres:16
    container_name: postgres-server
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=zabbix
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - polaris-network
    restart: unless-stopped

  # Zabbix Server
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.0-latest
    container_name: zabbix-server
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=zabbix
    ports:
      - "10051:10051"
    depends_on:
      - postgres-server
    networks:
      - polaris-network
    restart: unless-stopped

  # Zabbix Web Frontend
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.0-latest
    container_name: zabbix-web
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=zabbix
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - zabbix-server
    networks:
      - polaris-network
    restart: unless-stopped

  # Zabbix Agent (monitoring the host/docker environment)
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    container_name: zabbix-agent
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=polaris-host
    ports:
      - "10050:10050"
    depends_on:
      - zabbix-server
    networks:
      - polaris-network
    restart: unless-stopped

networks:
  polaris-network:
    driver: bridge

volumes:
  postgres-data:
